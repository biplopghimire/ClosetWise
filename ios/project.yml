name: ClosetWise
options:
  bundleIdPrefix: edu.cmu.closetwise
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.0.0
targets:
  ClosetWise:
    type: application
    platform: iOS
    sources:
      - path: ClosetWise
        excludes:
          - "Config/*.xcconfig"
    configFiles:
      Debug: ClosetWise/Config/App.xcconfig
      Release: ClosetWise/Config/App.xcconfig
    dependencies:
      - package: Supabase
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: edu.cmu.closetwise.app
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.10"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSCameraUsageDescription: "Take photos of your clothes and outfits."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Add clothes from your photo library."
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "ClosetWise checks the weather where you are so outfit ideas suit the day. Your location isn't stored."
        INFOPLIST_KEY_CFBundleDisplayName: ClosetWise
    info:
      path: ClosetWise/Info.plist
      properties:
        SupabaseURL: $(SUPABASE_URL)
        SupabaseAnonKey: $(SUPABASE_ANON_KEY)
  ClosetWiseTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ClosetWiseTests
    dependencies:
      - target: ClosetWise
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.10"
schemes:
  ClosetWise:
    build:
      targets:
        ClosetWise: all
    test:
      targets:
        - ClosetWiseTests
